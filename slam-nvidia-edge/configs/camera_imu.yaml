# VIO (camera + IMU) parameters.
vio_node:
  ros__parameters:
    camera_topic: /camera/image
    camera_info_topic: /camera/camera_info
    imu_topic: /imu/data

    # Image preprocessing
    target_width: 640
    target_height: 400
    equalize_histogram: true

    # Feature tracking (placeholder tracker; real frontend may override)
    max_features: 200
    min_features_for_tracking: 30

    # IMU
    imu_buffer_seconds: 10.0
    gyro_noise_density: 0.00016      # rad/s/sqrt(Hz)
    accel_noise_density: 0.0028      # m/s^2/sqrt(Hz)
    gyro_bias_random_walk: 0.000022
    accel_bias_random_walk: 0.00086
    gravity_magnitude: 9.80665

    # Camera-IMU extrinsics/time offset (calibrate with kalibr; snapshot is recorded)
    time_offset_camera_to_imu_ms: 0.0
    max_sync_offset_ms: 5.0

    # Keyframe policy
    keyframe_min_interval_s: 0.25
    keyframe_min_translation_m: 0.15
    keyframe_min_rotation_rad: 0.15

    # Sliding window
    window_size: 10

    world_frame: odom
    body_frame: base_link
